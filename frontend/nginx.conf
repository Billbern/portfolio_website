# Dropped into /etc/nginx/conf.d/default.conf by the Dockerfile.
# Serves the CRA build from /usr/share/nginx/html.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip everything textual once it's worth compressing (>1 KiB).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # CRA hash-revisioned bundles under /static/: cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App shell must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /work/:slug (and any unknown path) -> app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
